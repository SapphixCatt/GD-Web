<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash</title>
  <link rel="icon" type="image/png" href="img/GD.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      position: relative;
    }
    .bg {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: fill;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .corner-art {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }
    .bottom-left {
      bottom: 0;
      left: 0;
    }
    .top-left {
      top: 0;
      left: 0;
      transform: scaleY(-1);
    }
    .bottom-right {
      bottom: 0;
      right: 0;
      transform: scaleX(-1);
    }
    .top-right {
      top: 0;
      right: 0;
      transform: rotate(180deg);
    }
    .logo {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
    }
    .buttons-container {
      position: absolute;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .buttons-row {
      display: flex;
      justify-content: center;
      gap: 30px;
    }
    .button-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s ease-in-out;
    }
    .button-item img {
      zoom: 0.5;
    }
    .button-item:hover {
      transform: scale(1.05);
    }
    .button-item:active {
      transform: scale(0.95);
    }
    .sub-image {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <img class="bg" src="img/GJ_gradientBG-hd.png" alt="">
  <img class="corner-art bottom-left" src="img/GJ_sideArt_001.png" alt="">
  <img class="corner-art top-left" src="img/GJ_sideArt_001.png" alt="">
  <img class="corner-art bottom-right" src="img/GJ_sideArt_001.png" alt="">
  <img class="corner-art top-right" src="img/GJ_sideArt_001.png" alt="">
  <img class="logo" src="img/GJ_logo_001.png" alt="Geometry Dash Logo">

  <div class="buttons-container">
    <!-- Row 1 -->
    <div class="buttons-row">
      <a href="Geometry Dash Lite/index.html" class="button-item">
        <img src="img/GDL.png" alt="Geometry Dash Lite">
        <img class="sub-image" src="img/Lite.png" alt="Lite">
      </a>
      <a href="Geometry Dash Subzero/index.html" class="button-item">
        <img src="img/GDS.png" alt="Geometry Dash SubZero">
        <img class="sub-image" src="img/SubZero.png" alt="SubZero">
      </a>
      <a href="Geometry Dash Meltdown/index.html" class="button-item">
        <img src="img/GDM.png" alt="Geometry Dash Meltdown">
        <img class="sub-image" src="img/Meltdown.png" alt="Meltdown">
      </a>
    </div>

    <!-- Row 2 -->
    <div class="buttons-row">
      <a href="Geometry Dash World/index.html" class="button-item">
        <img src="img/GDW.png" alt="Geometry Dash World">
        <img class="sub-image" src="img/World.png" alt="World">
      </a>
      <a href="Geometry Dash Breeze/index.html" class="button-item">
        <img src="img/GDB.png" alt="Geometry Dash Breeze">
        <img class="sub-image" src="img/Breeze.png" alt="Breeze">
      </a>
    </div>
  </div>
</body>
</html>
