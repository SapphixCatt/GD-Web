<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geometry Dash Lite - Private Archive</title>
    
    <link rel="stylesheet" href="themes/://geometrydash23.com">
    <link rel="stylesheet" href="themes/://geometrydash23.com">
    <link rel="stylesheet" href="themes/://geometrydash23.com"> 
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <!-- Game Container Layer -->
    <div id="gameContainer" style="padding: 0px; margin: 0px; border: 0px; position: relative;">
        <canvas id="#canvas" style="width: 100%; height: 100%;"></canvas>
    </div>

    <!-- Clean Loading Overlay Layer -->
    <div id="loader">
        <img class="logo" src="image/loading3860.png?v=1">
        <div class="spinner"></div>
        <div class="pos_progress">
            <div class="progress">
                <div class="posfull"><img class="full" src="image/process_bar_back.png"></div>
                <div class="posbox"><img class="box_process" src="image/process_bar_front.png"></div>
            </div>
        </div>	
    </div>

    <!-- Empty Callback Functions Required by the Unity Core -->
    <script>
        function UnityCallPlayJs() { console.log("unity call play game"); }
        function UnityCallAgainJs() { console.log("unity call again"); }
        function UnityCallReturnHomeJs() { console.log("unity call return home"); }
        function UnityCallChooseLevelJs() { console.log("unity call choose level"); }
        function UnityCallCloseLeaderboardJs() { console.log("unity call close leaderboard"); }
        function UnityCallChooseCharacterJs() { console.log("unity call choose character"); }
        function UnityCallChooseColorJs() { console.log("unity call choose color"); }
        function UnityCallEndgameJs() { console.log("unity call end game"); }
        function UnityCallContinueJs() { console.log("unity call continue"); }
        function UnityCallChangeModeJs() { console.log("unity call change mode"); }
        function UnityCallPauseGameJs() { console.log("unity call pause game"); }
        function UnityCallChangeLevelJs() { console.log("unity call change level"); }
        function UnityCallLevelUpJs() { console.log("unity call level up"); }
    </script>

    <!-- Core Engine Scripts -->
    <script src="Build/UnityLoader.js"></script>
    <script>
        // Bypasses browser compatibility warnings
        UnityLoader.compatibilityCheck = function(e, t, r) { t(); };
        
        // Bootstraps the engine using the clean JSON pointer
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/geometrydash.json", {
            onProgress: UnityProgress,
            decompressionFallback: true
        });

        // Tracks asset loading benchmarks
        function UnityProgress(gameInstance, progress) {
            if (!gameInstance.Module) {
                return;
            }
            const loader = document.querySelector("#loader");
            if (!gameInstance.progress) {
                const progressEl = document.querySelector("#loader .progress");
                progressEl.style.display = "block";
                gameInstance.progress = progressEl.querySelector(".full");
                loader.querySelector(".spinner").style.display = "none";
            }
            gameInstance.progress.style.transform = `scaleX(${progress})`;
            if (progress === 1 && !gameInstance.removeTimeout) {
                gameInstance.removeTimeout = setTimeout(function() {
                    loader.style.display = "none";
                }, 2000);
            }
        }

        // Fullscreen API hooks for input handling
        var theElement = document.getElementById("gameContainer");
        theElement.addEventListener("mouseup", tapOrClick, false);
        theElement.addEventListener("touchend", tapOrClick, false);

        function tapOrClick(event) {
            fullScreenAPI();
            event.preventDefault();
            return false;
        }

        function HiddenClass(instane_game) {
            var widthPage = window.innerWidth;
            var heightPage = window.innerHeight;
            if (heightPage > widthPage) {
                document.getElementById('orientation').style.display = "block"; 
                document.getElementById("gameContainer").style.display = "none"; 
                gameInstance.SendMessage('AudioMainController', 'JSCallUnity', 0);
            } else {
                document.getElementById('orientation').style.display = "none";
                document.getElementById("gameContainer").style.display = "block";
                gameInstance.SendMessage('AudioMainController', 'JSCallUnity', 1);
            }
        }

        function fullScreenAPI() {
            var ua = navigator.userAgent.toLowerCase();
            var isAndroid = ua.indexOf("android") > -1;
            if (isAndroid) {
                GoFullScreen(document.documentElement);
            }
        }

        function GoFullScreen(element) {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement ) {
                if (element.requestFullscreen && document.fullscreenEnabled) {
                    element.requestFullscreen();
                } else if (element.mozRequestFullScreen) {
                    element.mozRequestFullScreen();
                } else if (element.webkitRequestFullscreen) {
                    element.webkitRequestFullscreen();
                } else if (element.msRequestFullscreen) {
                    element.msRequestFullscreen();
                }
            }
        }
    </script>
</body>
</html>
